apiVersion: v1
kind: Secret
metadata:
  name: noobaa-s3-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  # Populated automatically by setup.sh, or manually:
  #   oc extract secret/noobaa-admin -n openshift-storage --keys=AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY --to=-
  credentials: |
    [default]
    aws_access_key_id = <NOOBAA_ACCESS_KEY>
    aws_secret_access_key = <NOOBAA_SECRET_KEY>
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: noobaa-s3
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: noobaa-s3-credentials
      key: credentials
  endpoint:
    url:
      type: Static
      static: https://<S3_ROUTE>
    hostnameImmutable: true
    services:
      - s3
    source: Custom
  skip_credentials_validation: true
  skip_metadata_api_check: true
  skip_region_validation: true
  skip_requesting_account_id: true
  s3_use_path_style: true
